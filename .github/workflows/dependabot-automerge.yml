name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    # Only Dependabot's own PRs; the action does nothing useful for anyone else.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ahmadnassri/action-dependabot-auto-merge@v2
        with:
          target: minor
          # A PAT, not GITHUB_TOKEN: the default token can't merge PRs. For
          # Dependabot-triggered runs this must exist as a *Dependabot* secret
          # (repo Settings > Secrets > Dependabot), not only an Actions secret.
          github-token: ${{ secrets.DEPENDABOT_GITHUB_TOKEN }}
